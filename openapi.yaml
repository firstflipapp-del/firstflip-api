  /cards:
    post:
      operationId: createCard
      x-display-name: "Create a virtual card"
      x-required-scope: cards:write
      tags: [Cards]
      summary: Create a virtual card
      description: |
        Issues one sandbox USD card to one of your customers. The card starts at `balance: 0` with
        no spend limits, and every later call on this surface moves or gates that balance.

        `customer.first_name`, `customer.last_name` and `customer.email` are required; the customer
        is validated and then **not stored** — no name or email is persisted on the card, so a
        leaked card id carries no PII with it. `reference` is yours, unique per business (a repeat
        returns `409 duplicate_reference`), and defaults to the card id. `currency` may only be
        `USD`; sending anything else returns 400.

        The three limits are optional at issue time and are set or cleared later on
        `POST /cards/{id}/spend_limits`. They are per-card ceilings you choose, and no platform maximum
        is applied to any single axis. FirstFlip's ceilings sit elsewhere: one on how many cards a key
        may hold open, and one on what all your cards may spend together — both stated below and in
        the authorization section.

        FirstFlip's one cap on issuing is a count, not an amount: a key may hold **250 open cards**.
        The 251st `POST /cards` answers `409 card_limit_reached` with `param: cards` and nothing moves;
        closing a card frees a slot, so a healthy integration is never locked out. Resending the same
        `Idempotency-Key` is not a new card and is not counted.

        The response shows `number_last4`, `expiry_month` and `expiry_year`. Those are minted here
        for shape only — this card has no issuer, no full PAN and no CVV, and `sandbox.real_card`
        says so on every answer. Requires an `Idempotency-Key` header.

        Live mode: a live key is refused here before the body is read — issuing a real card needs the
        cardholder rail FirstFlip has not built, so this answers `403 live_precondition_unmet` with
        `param: cardholder`. No card is minted, and the refusal is what your key replays.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCardRequest" }
            example:
              reference: cust-1042
              customer: { first_name: Amara, last_name: Okafor, email: amara@example.com }
              daily_limit: 500
              per_transaction_limit: 200
      responses:
        "201":
          headers:
            Request-Id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            X-RateLimit-Limit: { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
            Idempotency-Status-Version: { $ref: "#/components/headers/IdempotencyStatusVersion" }
            Idempotency-Key-State: { $ref: "#/components/headers/IdempotencyKeyState" }
            Idempotent-Original-At: { $ref: "#/components/headers/IdempotentOriginalAt" }
            Idempotency-Reference: { $ref: "#/components/headers/IdempotencyReference" }
          description: The card was issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
              examples:
                issued:
                  $ref: "#/components/examples/cardIssued"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    get:
      operationId: listCards
      x-display-name: "List virtual cards"
      x-required-scope: cards:read
      tags: [Cards]
      summary: List virtual cards
      description: |
        Returns your cards, newest first. Filter by `status` (`active`, `frozen` or `closed`) or a
        `created_from`/`created_before` window. Closed cards are listed too — that is how you find a
        customer's old card id.

        Live mode: this read runs live. A live key gets its own live cards and nothing else — a live page
        never contains a test card, and each row answers `livemode: true` with `sandbox: null`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/CreatedFrom"
        - $ref: "#/components/parameters/CreatedBefore"
