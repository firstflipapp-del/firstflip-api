# FirstFlip Business API — OpenAPI 3.1 specification.
#
# SINGLE SOURCE OF TRUTH. The API Bible, the Postman collection, the reference site and the SDKs are
# all generated from this file. Every path, field and error below is grounded in the implementation
# and checked against it by `scripts/check-service-contract.js`. Nothing here is aspirational:
# planned-but-not-built work lives under `x-roadmap`, never as a live path.
#
# Scope: the public /v1 Developer Platform surface, authenticated with an `ffk_` secret key. No leg of this
# surface moves real money today, and a live key still cannot be minted. `/v1/cards` is the one resource that
# answers a live key leg by leg rather than refusing it; every other resource refuses one outright.
# (Keys and webhook endpoints are minted by
# the business owner over the session-authenticated /api/business/developer surface — an API, not yet a
# screen in the app — which is out of scope for this public-API spec; see x-roadmap and the
# Authentication section.)
openapi: 3.1.0

info:
  title: FirstFlip Business API
  version: "2026-11-02"
  summary: Accept crypto payments, create reusable payment links, and receive signed webhooks.
  description: |
    The FirstFlip Business API lets a business accept payments and build on FirstFlip
    programmatically. It is a JSON, resource-oriented HTTP API: predictable paths, `Bearer`
    secret-key auth, an `Idempotency-Key` on every write, cursor pagination, and one canonical
    error shape.

    ## Base URL & versioning
    All paths are prefixed with `/v1` (the version is in the path; a breaking change means `/v2`,
    additive changes stay in `/v1`). The sandbox base URL is `https://api.firstflip.ng/v1`.

    > **Test mode only.** Every endpoint runs in TEST MODE. No real money moves. Use your
    > `ffk_test_…` secret key. Live mode is **not yet enabled**; a live key returns
    > `403 live_mode_unavailable` on money endpoints, and the same code you write against the
    > sandbox will work unchanged when live mode opens.
    >
    > One surface is ahead of that rule: `/v1/cards` answers a live key **leg by leg** instead of with one
    > blanket refusal. Listing, retrieval, freeze and unfreeze already run live, and every leg that would move
    > or release money — including the transaction statement list — returns `403 live_precondition_unmet` with
    > the missing rail named in `error.param`; see the Cards tag. Nothing else in `/v1` has that wiring yet.

    ## Authentication
    Send your secret key as a bearer token on every request to a non-public endpoint:

    ```
    Authorization: Bearer $FIRSTFLIP_SECRET_KEY
    ```

    A secret key looks like `ffk_test_…` (test) or `ffk_live_…` (live). It is shown once, when it is
    created, and only its hash is stored — if you lose it, rotate it. The key is the sole source of
    identity: FirstFlip resolves the owning business from the key, so there is no account id to send and
    no way to act for another business. Keep secret keys server-side; never ship one in a browser, mobile
    app, or public repository. You mint and revoke keys yourself over the session-authenticated
    `POST /api/business/developer/keys` (a screen for it is still to come — during the beta, ask FirstFlip
    and we issue your test key over a private channel). There you choose the key's `scopes` and pin it to
    up to 20 exact `ipAllowlist` addresses.

    ## Scopes
    A key carries a scope list chosen when it is created. Every endpoint names the one scope it
    needs; a surface that both reads and writes has a pair:

    | Scope | Endpoints |
    |---|---|
    | `account:read` | `GET /account` |
    | `charges:read` / `charges:write` | charges: list/get, create, cancel, simulate payment |
    | `payment_links:read` / `payment_links:write` | payment links: list/get, create, deactivate |
    | `subaccounts:read` / `subaccounts:write` | sub-accounts: list/get, create, suspend, activate |
    | `cards:read` / `cards:write` | cards: list/get, issue, fund, withdraw, freeze/unfreeze, close, spend limits, simulate authorization, transactions |
    | `otps:read` / `otps:write` | OTP pricing/lookup, create, validate |
    | `fx:read` / `fx:write` | FX quotes and trades: get, create, simulate |
    | `virtual_accounts:read` / `virtual_accounts:write` | virtual accounts: get/list batch, create, bulk, deactivate, simulate payment |
    | `verifications:read` / `verifications:write` | BVN and bank-account verification, simulate |
    | `transfers:read` / `transfers:write` | transfers (payouts): list/get, create, bulk, get batch, simulate |
    | `assistant:ask` | `POST /assistant` |

    Every operation that requires a scope declares it as `x-required-scope`, so a tool can choose
    the right key without mapping this table by hand.

    Send `scopes` when creating a key to mint a least-privilege credential — a checkout widget only
    needs `payment_links:write`, a reconciliation job only needs `charges:read`, a payout service
    only needs `transfers:write`. A key created without a scope list (including every key that
    predates scopes) can do everything its mode allows. An endpoint the key's scopes don't cover
    returns `403 insufficient_scope`, which names the scope it wanted. Scopes are never widened
    after creation: rotate a key that needs more access.

    ## Idempotency
    Every `POST` that creates or changes something requires an `Idempotency-Key` header: a unique
    string you generate (a UUID v4 is ideal), up to 255 characters. If a request is interrupted,
    safely retry it with the **same** key — FirstFlip replays the original response (with
    `Idempotent-Replayed: true`) instead of acting twice. Reusing a key with a **different** body is
    rejected with `422 idempotency_key_reused`. A request still in flight returns
    `409 idempotency_in_progress`; retry it. Keys are scoped to your business and mode and expire
    after 24 hours. (`POST /assistant` and the public hosted pages do not take an idempotency key.)

    ## Pagination
    List endpoints return `{ "object": "list", "data": [ … ], "has_more": true|false }`, newest
    first. Page with `limit` (1–100, default 20) and `starting_after=<id of the last item>`. Paging
    is stable: even when many records share a timestamp (a bulk payout writes its whole batch at
    once), following `starting_after` never skips or repeats an item.

    Every list also takes a `created_from` / `created_before` window (RFC 3339; a bare date means
    midnight UTC). It is half-open — `created_from` inclusive, `created_before` exclusive — so
    `created_from=2026-11-04&created_before=2026-11-05` is exactly that UTC day, and walking
    consecutive windows counts every object once.

    ## Errors
    Every error — including malformed JSON, auth failures, rate limits and outages — uses one shape:

    ```json
    { "error": { "type": "invalid_request_error", "code": "invalid_parameter",
                 "message": "currency must be NGN or USD", "param": "currency" } }
    ```

    `type` groups the failure, `code` is the stable machine-readable reason, `message` is
    human-readable, and `param` names the offending field when there is one (otherwise `null`).

    Every response — success or failure, including `401`, `404`, `429` and `503` — also carries a
    `Request-Id` header: a UUID generated for that one request. A value you send is ignored, so an id
    quoted in a support ticket always names a request we can find. Include it when you contact us
    about an error. Every response is also marked `Cache-Control: no-store`: account data, balances
    and hosted pages must never sit in a shared or browser cache, where a stale page is worse than a
    failed one.
    The full catalog is `x-error-codes` below; the summary table:

    | HTTP | type | code | retryable | meaning |
    |---|---|---|---|---|
    | 400 | invalid_request_error | invalid_json | no | Request body is not valid JSON |
    | 400 | invalid_request_error | invalid_parameter | no | A parameter is missing or invalid (see `param`) |
    | 400 | invalid_request_error | amount_too_small | no | `amount` is below the minimum charge |
    | 400 | invalid_request_error | insufficient_balance | no | A card does not hold the amount you asked to take off it |
    | 400 | invalid_request_error | question_required | no | Assistant: no question was sent |
    | 400 | invalid_request_error | question_too_long | no | Assistant: question exceeds 2000 characters |
    | 400 | idempotency_error | idempotency_key_required | no | `Idempotency-Key` header missing on a POST |
    | 401 | authentication_error | invalid_api_key | no | Key missing, malformed, revoked, or wrong mode |
    | 401 | authentication_error | key_expired | no | This key reached its expiry date; create or rotate a key |
    | 403 | authentication_error | ip_not_allowed | no | Caller IP is not on this key's allow-list |
    | 403 | authentication_error | business_inactive | no | The business that owns the key is not active |
    | 403 | authentication_error | insufficient_scope | no | This key was created without the scope the endpoint requires |
    | 403 | invalid_request_error | live_mode_unavailable | no | Live mode is not open yet; use a test key |
    | 403 | invalid_request_error | live_precondition_unmet | no | This live leg is waiting on a named platform rail; `error.param` says which one (cards only today) |
    | 404 | invalid_request_error | not_found | no | No such route |
    | 404 | invalid_request_error | resource_missing | no | No such charge/payment link for this key |
    | 409 | invalid_request_error | charge_not_pending | no | Charge is not in a state that allows this action |
    | 409 | invalid_request_error | subaccount_not_active | no | Sub-account is already suspended and cannot be suspended again |
    | 409 | invalid_request_error | subaccount_not_suspended | no | Sub-account is already active and cannot be activated again |
    | 409 | invalid_request_error | duplicate_reference | no | `reference` already used by this business (charges, sub-accounts, cards) |
    | 409 | invalid_request_error | card_closed | no | Card is closed — every action on it is refused, including unfreeze |
    | 409 | invalid_request_error | card_not_active | no | Card is frozen, so a withdrawal was refused; unfreeze it first |
    | 409 | invalid_request_error | card_limit_reached | no | This key already holds its 250 open cards; close one first |
    | 409 | idempotency_error | idempotency_in_progress | yes | A request with this key is still running; retry |
    | 413 | invalid_request_error | body_too_large | no | Request body exceeds the size limit |
    | 422 | idempotency_error | idempotency_key_reused | no | Key reused with a different request body |
    | 429 | rate_limit_error | rate_limited | yes | Too many requests; honor `Retry-After` |
    | 500 | api_error | internal_error | yes | Unexpected error on FirstFlip's side |
    | 503 | api_error | service_unavailable | yes | FirstFlip is briefly unavailable; see `Retry-After` |
    | 503 | api_error | rate_unavailable | yes | Exchange rates are briefly unavailable; retry |
    | 503 | api_error | assistant_disabled | no | The developer assistant is switched off |
    | 503 | api_error | assistant_unavailable | yes | The assistant is temporarily unavailable |

    ## Rate limits
    Limits are enforced per secret key (and a per-IP backstop). On `429` the response carries
    `Retry-After` (seconds); authenticated responses also carry `X-RateLimit-Limit` and
    `X-RateLimit-Remaining`. Current windows: reads 300/min, writes 60/min, assistant 30/hour,
    per-IP backstop 1200/min, hosted sandbox pages 30/min per IP. Retry a `429` after the stated
    delay, reusing the same `Idempotency-Key` on writes.

    ## Webhooks
    FirstFlip POSTs signed events to the endpoint(s) you register over
    `POST /api/business/developer/webhooks`. Verify the
    `FirstFlip-Signature` header over the **raw** request body before trusting a webhook — see the
    `webhooks` section.

    ## Compliance
    FirstFlip is registered (not licensed) and shows integer-free major-unit amounts with an
    explicit currency on every money field. Secrets are never logged. Partner/rail names never
    appear in any request, response, field, error, or webhook payload.
  contact:
    name: FirstFlip Developer Support
    url: https://firstflip.ng
  license:
    name: © First Flip Ltd. All rights reserved. You may read these docs and use them to integrate with the FirstFlip API. The SDK and code samples are MIT (see LICENSE).
    identifier: LicenseRef-FirstFlip-Docs
  x-logo:
    altText: FirstFlip

externalDocs:
  description: FirstFlip developer portal (guides, quickstart, SDKs, Postman collection)
  url: https://firstflip.ng/developers

servers:
  - url: https://api.firstflip.ng/v1
    description: |
      Sandbox (test mode). The only base URL available today; the entire /v1 surface is test-mode
      and moves no money. Live mode is not yet enabled.

security:
  - bearerAuth: []

tags:
  - name: Account
    description: Identify the business behind the current secret key.
  - name: Charges
    description: A one-time request for payment. Create it, share its hosted URL, and act on `charge.paid`.
  - name: Payment links
    description: A reusable link. Each visitor who opens it gets a fresh charge; shareable and payable many times.
  - name: Sub-accounts
    description: >
      The tenant layer: your own end-users, provisioned under your business. Sandbox identities
      only today — a sub-account holds no wallet and accepts no real money (see `sandbox`).
  - name: Cards
    description: >
      USD virtual cards a business issues to its own customers, funded and spent through your API.
      In test mode the whole lifecycle is real in shape and nothing is real in money: no PAN is issued,
      no issuer is contacted, and no test balance can become spendable. A live key is answered leg by
      leg rather than with one blanket refusal, because the rails are not all missing at the same rate.
      Listing, retrieval, freeze and unfreeze run live today — freeze and unfreeze ask the issuer first
      and only then move our own record, so an issuer that refuses leaves the card active and answers
      `503 service_unavailable`. Issuing, funding, withdrawal, close, spend limits and the transaction
      list each answer `403 live_precondition_unmet` and name the rail they are waiting on in
      `error.param`: `cardholder`, `funding`, `withdrawal`, `settlement`, `limit_format` or
      `transaction_sync`. A `param` of `provider` is about your card row, not a rail: that live row
      carries no issuer id, or an issuer this server has no card code for. The authorization simulator
      stays test-only under every key — a live authorization is decided by the issuer, not by us.
      No live leg moves money yet.
  - name: Assistant
    description: A documentation Q&A helper that answers only from the published FirstFlip docs.
  - name: Hosted pages
    description: >
      Public, browser-facing pages (the token in the URL is the capability — no secret key). These
      return HTML, not JSON. In test mode the pay page carries a "Simulate payment" button.
  - name: Services sandbox
    description: >
      Test-mode money-adjacent services: FX quotes and trades, virtual accounts, BVN and bank-account
      verification, one-time passwords, transfers and bulk payouts. These record outcomes; they never
      move real money.
  - name: Webhooks
    description: >
      Deliveries to your endpoint, signed with `FirstFlip-Signature`. Verify over the raw body and
      deduplicate on `FirstFlip-Event-Id`; any non-2xx or timeout is retried with backoff.

paths:
  /account:
    get:
      operationId: getAccount
      x-display-name: "Retrieve the current account"
      x-required-scope: account:read
      tags: [Account]
      summary: Retrieve the current account
      description: |
        Returns the business tied to the secret key you sent, the key's mode, and the masked key.
        This is the ideal first call to confirm your credentials and environment.
      responses:
        "200":
          headers:
            Request-Id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            X-RateLimit-Limit: { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
          description: The account for this key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
              example:
                object: account
                business_name: Acme Stores
                livemode: false
                key: ffk_test_…a1b2
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /charges:
    post:
      operationId: createCharge
      x-display-name: "Create a charge"
      x-required-scope: charges:write
      tags: [Charges]
      summary: Create a charge
      description: |
        Creates a one-time charge for an amount you set in major units. FirstFlip quotes the exact
        crypto amount the customer must pay (asset + network you chose, plus the receive fee) and
        returns a `hosted_url` where they complete payment. In test mode the pay address is a
        labelled `TEST-…` placeholder and payment is simulated — nothing moves money.

        Requires an `Idempotency-Key` header. If you pass a `reference`, it must be unique within
        your business (a repeat returns `409 duplicate_reference`).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateChargeRequest" }
            example:
              amount: 25000
              currency: NGN
              description: Order #1048
              reference: order_1048
              pay_asset: USDT
              pay_network: trc20
              customer: { name: Jane Doe, email: jane@example.com }
              metadata: { order_id: "1048", channel: web }
      responses:
        "201":
          headers:
            Request-Id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            X-RateLimit-Limit: { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
            Idempotency-Status-Version: { $ref: "#/components/headers/IdempotencyStatusVersion" }
            Idempotency-Key-State: { $ref: "#/components/headers/IdempotencyKeyState" }
            Idempotent-Original-At: { $ref: "#/components/headers/IdempotentOriginalAt" }
            Idempotency-Reference: { $ref: "#/components/headers/IdempotencyReference" }
          description: The charge was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Charge" }
              examples:
                pending:
                  $ref: "#/components/examples/chargePending"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    get:
      operationId: listCharges
      x-display-name: "List charges"
      x-required-scope: charges:read
      tags: [Charges]
      summary: List charges
      description: Returns your charges, newest first. Filter by `status`, `reference` or a `created_from`/`created_before` window.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/CreatedFrom"
        - $ref: "#/components/parameters/CreatedBefore"
        - name: status
          in: query
          required: false
          description: Only charges in this state.
          schema:
            type: string
            enum: [pending, paid, expired, cancelled]
            example: pending
        - name: reference
          in: query
          required: false
          description: Only the charge carrying this merchant reference.
          schema: { type: string, maxLength: 100, example: order_1042 }
      responses:
        "200":
          headers:
            Request-Id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            X-RateLimit-Limit: { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
          description: A page of charges.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChargeList" }
              examples:
                page:
                  $ref: "#/components/examples/chargeList"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /charges/{id}:
    get:
      operationId: getCharge
      x-display-name: "Retrieve a charge"
      x-required-scope: charges:read
      tags: [Charges]
      summary: Retrieve a charge
      description: |
        Fetches a charge by id. A pending charge past its `expires_at` is lazily transitioned to
        `expired` (and `charge.expired` is emitted) the first time it is read.
      parameters:
        - $ref: "#/components/parameters/ChargeId"
      responses:
        "200":
          headers:
            Request-Id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            X-RateLimit-Limit: { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
          description: The charge.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Charge" }
              examples:
                pending:
                  $ref: "#/components/examples/chargePending"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /charges/{id}/cancel:
    post:
      operationId: cancelCharge
      x-display-name: "Cancel a charge"
      x-required-scope: charges:write
      tags: [Charges]
      summary: Cancel a charge
      description: |
        Cancels a `pending` charge so it can no longer be paid. Only a pending charge can be
        cancelled; any other state returns `409 charge_not_pending`. Emits `charge.cancelled`.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: "#/components/parameters/ChargeId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          headers:
            Request-Id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            X-RateLimit-Limit: { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
            Idempotency-Status-Version: { $ref: "#/components/headers/IdempotencyStatusVersion" }
            Idempotency-Key-State: { $ref: "#/components/headers/IdempotencyKeyState" }
            Idempotent-Original-At: { $ref: "#/components/headers/IdempotentOriginalAt" }
            Idempotency-Reference: { $ref: "#/components/headers/IdempotencyReference" }
          description: The cancelled charge.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Charge" }
              examples:
                cancelled:
                  $ref: "#/components/examples/chargeCancelled"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /charges/{id}/simulate_payment:
    post:
      operationId: simulateChargePayment
      x-display-name: "Simulate payment (test mode)"
      x-required-scope: charges:write
      tags: [Charges]
      summary: Simulate payment (test mode)
      description: |
        **Test mode only.** Marks a `pending` charge as `paid`, exactly as a real customer payment
        would, and emits `charge.paid`. Use it to exercise your webhook and fulfilment flow without
        moving crypto. Any non-pending charge returns `409 charge_not_pending`. Requires an
        `Idempotency-Key` header. (The same effect is available to a human tester via the
        "Simulate payment" button on the hosted pay page.)
      parameters:
        - $ref: "#/components/parameters/ChargeId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          headers:
            Request-Id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            X-RateLimit-Limit: { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
            Idempotency-Status-Version: { $ref: "#/components/headers/IdempotencyStatusVersion" }
            Idempotency-Key-State: { $ref: "#/components/headers/IdempotencyKeyState" }
            Idempotent-Original-At: { $ref: "#/components/headers/IdempotentOriginalAt" }
            Idempotency-Reference: { $ref: "#/components/headers/IdempotencyReference" }
          description: The now-paid charge.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Charge" }
              examples:
                paid:
                  $ref: "#/components/examples/chargePaid"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
