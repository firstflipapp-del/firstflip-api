# Machine-readable error catalog (the single source for the Bible's error table, SDK error maps, and
# Postman tests). Grounded in customError.js + every ApiError/apiError call on the /v1 path.
x-error-codes:
  - { code: invalid_json, type: invalid_request_error, http_status: 400, retryable: false, message: The request body is not valid JSON. }
  - { code: invalid_parameter, type: invalid_request_error, http_status: 400, retryable: false, message: A parameter is missing or invalid; see param. }
  - { code: amount_too_small, type: invalid_request_error, http_status: 400, retryable: false, message: amount is below the minimum charge. }
  - { code: question_required, type: invalid_request_error, http_status: 400, retryable: false, message: "Assistant: a question is required." }
  - { code: question_too_long, type: invalid_request_error, http_status: 400, retryable: false, message: "Assistant: the question exceeds 2000 characters." }
  - { code: idempotency_key_required, type: idempotency_error, http_status: 400, retryable: false, message: An Idempotency-Key header is required on every POST. }
  - { code: invalid_api_key, type: authentication_error, http_status: 401, retryable: false, message: "The API key is missing, malformed, revoked, or for the wrong mode." }
  - { code: key_expired, type: authentication_error, http_status: 401, retryable: false, message: "This API key expired. Create or rotate a key to continue." }
  - { code: ip_not_allowed, type: authentication_error, http_status: 403, retryable: false, message: The caller IP is not on this key's allow-list. }
  - { code: business_inactive, type: authentication_error, http_status: 403, retryable: false, message: The business that owns this key is not active. }
  - { code: api_access_paused, type: authentication_error, http_status: 403, retryable: false, message: "API access for this business is paused by FirstFlip. Contact FirstFlip support to resume it." }
  - { code: insufficient_scope, type: authentication_error, http_status: 403, retryable: false, message: The key was created without the scope this endpoint requires; create a key that carries it. }
  - { code: live_mode_unavailable, type: invalid_request_error, http_status: 403, retryable: false, message: Live mode is not open yet; use a test key. }
  - { code: live_precondition_unmet, type: invalid_request_error, http_status: 403, retryable: false, message: "This live leg is waiting on a named platform rail; `error.param` says which one. Use a test key." }
  - { code: card_closed, type: invalid_request_error, http_status: 409, retryable: false, message: "This card is closed; no action can ever succeed on it again. Issue a new card." }
  - { code: card_not_active, type: invalid_request_error, http_status: 409, retryable: false, message: "Only an active card can be withdrawn from. Unfreeze it first." }
  - { code: card_limit_reached, type: invalid_request_error, http_status: 409, retryable: false, message: "This API key already holds the maximum number of open cards. Close one, then issue again." }
  - { code: insufficient_balance, type: invalid_request_error, http_status: 400, retryable: false, message: "The card does not hold that much. Fund it, or ask for a smaller amount." }
  - { code: not_found, type: invalid_request_error, http_status: 404, retryable: false, message: No such route. }
  - { code: resource_missing, type: invalid_request_error, http_status: 404, retryable: false, message: No such resource for this key. }
  - { code: charge_not_pending, type: invalid_request_error, http_status: 409, retryable: false, message: The charge is not in a state that allows this action. }
  - { code: subaccount_not_active, type: invalid_request_error, http_status: 409, retryable: false, message: The sub-account is no longer active and cannot be suspended. }
  - { code: subaccount_not_suspended, type: invalid_request_error, http_status: 409, retryable: false, message: The sub-account is no longer suspended and cannot be activated. }
  - { code: duplicate_reference, type: invalid_request_error, http_status: 409, retryable: false, message: A charge or sub-account with this reference already exists for the business. }
  - { code: idempotency_in_progress, type: idempotency_error, http_status: 409, retryable: true, message: A request with this Idempotency-Key is still in progress; retry. }
  - { code: body_too_large, type: invalid_request_error, http_status: 413, retryable: false, message: The request body is too large. }
  - { code: idempotency_key_reused, type: idempotency_error, http_status: 422, retryable: false, message: This Idempotency-Key was already used with a different request body. }
  - { code: rate_limited, type: rate_limit_error, http_status: 429, retryable: true, message: Too many requests; honor Retry-After. }
  - { code: internal_error, type: api_error, http_status: 500, retryable: true, message: Something went wrong on FirstFlip's end. }
  - { code: service_unavailable, type: api_error, http_status: 503, retryable: true, message: FirstFlip is briefly unavailable; retry shortly. }
  - { code: rate_unavailable, type: api_error, http_status: 503, retryable: true, message: Exchange rates are briefly unavailable; retry. }
  - { code: assistant_disabled, type: api_error, http_status: 503, retryable: false, message: The developer assistant is switched off. }
  - { code: assistant_unavailable, type: api_error, http_status: 503, retryable: true, message: The assistant is temporarily unavailable. }

  - { code: pricing_unavailable, type: api_error, http_status: 503, retryable: true, message: "See the service error message and param." }
  - { code: invalid_otp, type: invalid_request_error, http_status: 400, retryable: false, message: "See the service error message and param." }
  - { code: otp_not_pending, type: invalid_request_error, http_status: 409, retryable: false, message: "See the service error message and param." }
  - { code: quote_not_ready, type: invalid_request_error, http_status: 409, retryable: false, message: "See the service error message and param." }
  - { code: quote_already_used, type: invalid_request_error, http_status: 409, retryable: false, message: "See the service error message and param." }
  - { code: trade_not_pending, type: invalid_request_error, http_status: 409, retryable: false, message: "See the service error message and param." }
  - { code: account_inactive, type: invalid_request_error, http_status: 409, retryable: false, message: "See the service error message and param." }
  - { code: bvn_not_verified, type: invalid_request_error, http_status: 409, retryable: false, message: "See the service error message and param." }
  - { code: verification_not_pending, type: invalid_request_error, http_status: 409, retryable: false, message: "See the service error message and param." }
  - { code: verification_unavailable, type: api_error, http_status: 503, retryable: true, message: "See the service error message and param." }
  - { code: account_not_found, type: invalid_request_error, http_status: 400, retryable: false, message: "See the service error message and param." }
  - { code: transfer_not_pending, type: invalid_request_error, http_status: 409, retryable: false, message: "See the service error message and param." }

# Planned, NOT yet available. Do NOT integrate against anything here — these paths/fields/events do
# not exist today. Listed so the roadmap is explicit and nothing is mistaken for live.
x-roadmap:
  status: Test mode only. Live mode (devplatform_live_enabled) is OFF; no real money moves through /v1.
  planned:
    - live_mode: Real charges once the concurrent receive rail is ready. Live keys (ffk_live_) then work unchanged.
    - publishable_key_split: A publishable/secret (pk/sk) key split. Today there is one secret-key type.
    - sub_account_live: Live provisioning for sub-accounts — a real wallet, KYC and settlement per tenant. Test-mode sub-accounts exist today (/subaccounts); live rails do not.
    - live_virtual_cards: Live card issuing — issuer activation, a prefunded business balance, per-card settlement and a server-side step-up on fund/withdraw/close. The full test-mode lifecycle (issue, fund, spend, freeze, limit, close) is available today at /cards.
    - live_transfers_payouts: Live money movement — internal transfers, crypto→bank payouts, withdrawals (idempotent + step-up + tier cap).
    - sell_crypto: Quote/lock/execute selling crypto to a fiat balance over the API.
    - additional_webhook_events: >
        Charge events and the implemented local service events are documented in services.openapi.json.
        Live card, payout, sell and sub-account KYC events remain planned.
