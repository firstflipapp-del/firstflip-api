  /assistant:
    post:
      operationId: askAssistant
      x-display-name: "Ask the developer assistant"
      x-required-scope: assistant:ask
      tags: [Assistant]
      summary: Ask the developer assistant
      description: |
        Answers a developer question strictly from the published FirstFlip documentation (it never
        invents facts; unsupported claims are scrubbed, and `removed_claims` counts how many). This
        is **not** a money call and takes **no** `Idempotency-Key`. Rate limited to 30 questions per
        key per hour. The assistant is gated by a separate switch and is OFF by default; when off it
        returns `503 assistant_disabled`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  maxLength: 2000
                  description: Your question, 1–2000 characters.
              additionalProperties: false
            example:
              question: How do I verify a webhook signature?
      responses:
        "200":
          headers:
            Request-Id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            X-RateLimit-Limit: { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
          description: The assistant's answer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantAnswer" }
              example:
                object: assistant_answer
                answer: Verify the FirstFlip-Signature header by recomputing HMAC-SHA256 over "<t>.<raw body>" with your signing secret, within a 5-minute tolerance.
                removed_claims: 0
        "400":
          headers:
            Request-Id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            X-RateLimit-Limit: { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
          description: The question is missing or too long (`param` is `question`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { type: invalid_request_error, code: question_required, message: Ask a question., param: question }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          headers:
            Request-Id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          description: |
            The assistant cannot answer right now. Read `code`: `assistant_disabled` means the feature
            is switched off and retrying will not help until the operator enables it;
            `assistant_unavailable` is transient — retry after `Retry-After` seconds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                assistant_disabled:
                  value: { error: { type: api_error, code: assistant_disabled, message: The assistant is switched off., param: null } }
                assistant_unavailable:
                  value: { error: { type: api_error, code: assistant_unavailable, message: The assistant is unavailable right now. Try again shortly., param: null } }

