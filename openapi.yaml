webhooks:
  charge.paid:
    post:
      operationId: onChargePaid
      tags: [Webhooks]
      summary: A charge was paid
      description: |
        Sent when a charge transitions to `paid`. `data.object` is the full [Charge](#/components/schemas/Charge)
        with `status: "paid"` and a `paid_at`. This is the event to fulfil an order on. Delivery is
        at-least-once and deduplicated by event `id`; return any `2xx` quickly to acknowledge.

        **Verify every webhook over the RAW body before parsing it.** The `FirstFlip-Signature`
        header is `t=<unix seconds>,v1=<hex>` where `v1 = HMAC-SHA256(signingSecret, "<t>.<rawBody>")`.
        Recompute it with your endpoint's signing secret (`whsec_…`, shown once at registration),
        compare in constant time, and reject if `t` is more than 300 seconds from now (replay guard).
      parameters:
        - $ref: "#/components/parameters/WebhookSignature"
        - $ref: "#/components/parameters/WebhookEventId"
        - $ref: "#/components/parameters/WebhookEventType"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Event" }
            examples:
              charge_paid:
                $ref: "#/components/examples/eventChargePaid"
      responses:
        "2XX":
          description: Your endpoint acknowledged receipt. Any non-2xx (or a timeout) is retried with backoff.
  charge.expired:
    post:
      operationId: onChargeExpired
      tags: [Webhooks]
      summary: A charge expired
      description: |
        Sent when a pending charge passes its `expires_at` without payment. `data.object` is the
        Charge with `status: "expired"`. Verify the signature as described for `charge.paid`.
      parameters:
        - $ref: "#/components/parameters/WebhookSignature"
        - $ref: "#/components/parameters/WebhookEventId"
        - $ref: "#/components/parameters/WebhookEventType"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Event" }
            examples:
              charge_expired:
                $ref: "#/components/examples/eventChargeExpired"
      responses:
        "2XX":
          description: Acknowledged.
  charge.cancelled:
    post:
      operationId: onChargeCancelled
      tags: [Webhooks]
      summary: A charge was cancelled
      description: |
        Sent when you cancel a pending charge. `data.object` is the Charge with
        `status: "cancelled"`. Verify the signature as described for `charge.paid`.
      parameters:
        - $ref: "#/components/parameters/WebhookSignature"
        - $ref: "#/components/parameters/WebhookEventId"
        - $ref: "#/components/parameters/WebhookEventType"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Event" }
            examples:
              charge_cancelled:
                $ref: "#/components/examples/eventChargeCancelled"
      responses:
        "2XX":
          description: Acknowledged.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: 'ffk_test_… or ffk_live_…'
      description: Your secret key from FirstFlip (issued on request during the beta). Keep it on your server only.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A unique key you generate (e.g. a UUID v4), up to 255 characters. Required on every POST
        that creates or changes something. Retry a failed request with the same key to replay the
        original response instead of acting twice.
      schema:
        type: string
        maxLength: 255
      example: a1b2c3d4-e5f6-4789-a0b1-c2d3e4f50617
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, 1–100 (default 20).
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      example: 20
    StartingAfter:
      name: starting_after
      in: query
      required: false
      description: A cursor — the id of the last object on the previous page. Returns the next page (older) items.
      schema: { type: string, example: ch_test_2a3b4c5d6e7f80910a1b2c3d }
    CreatedFrom:
      name: created_from
      in: query
      required: false
      description: |
        Only objects created at or after this instant. RFC 3339; a bare date means midnight UTC.
        With `created_before` it forms a half-open window, so `created_from=2026-11-04&created_before=2026-11-05`
        is exactly that UTC day, and consecutive windows never count an object twice.
      schema: { type: string, format: date-time, example: "2026-11-04T00:00:00Z" }
    CreatedBefore:
      name: created_before
      in: query
      required: false
      description: Only objects created strictly before this instant. RFC 3339; a bare date means midnight UTC.
      schema: { type: string, format: date-time, example: "2026-11-05T00:00:00Z" }
    ChargeId:
      name: id
      in: path
      required: true
      description: The charge id (`ch_test_…`).
      schema: { type: string }
      example: ch_test_0a1b2c3d4e5f60718293a4b5
    PaymentLinkId:
      name: id
      in: path
      required: true
      description: The payment link id (`pl_test_…`).
      schema: { type: string }
      example: pl_test_1a2b3c4d5e6f70819a0b1c2d
    SubAccountId:
      name: id
      in: path
      required: true
      description: The sub-account id (`sa_test_…`).
      schema: { type: string }
      example: sa_test_2a3b4c5d6e7f80910a1b2c3d
    CardId:
      name: id
      in: path
      required: true
      description: The card id (`card_test_…`) returned when the card was issued.
      schema: { type: string }
      example: card_test_3a4b5c6d7e8f90122a3b4c5d
    HostedToken:
      name: token
      in: path
      required: true
      description: The 32-character hex capability token embedded in a hosted URL.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
        example: a1b2c3d4e5f60718293a4b5c6d7e8f90
    WebhookSignature:
      name: FirstFlip-Signature
      in: header
      required: true
      description: "`t=<unix seconds>,v1=<hex HMAC-SHA256(signingSecret, \"<t>.<rawBody>\")>`. Verify over the raw body."
      schema: { type: string }
      example: t=1762000496,v1=5257a869e7ecebeda32affa5f9f6e3b0c0e3f1d2a3b4c5d6e7f8091a2b3c4d5e6
    WebhookEventId:
      name: FirstFlip-Event-Id
      in: header
      required: true
      description: The event id (`evt_…`). Use it to deduplicate at-least-once deliveries.
      schema: { type: string }
    WebhookEventType:
      name: FirstFlip-Event-Type
      in: header
      required: true
      description: The event type, e.g. `charge.paid`.
      schema: { type: string }

  headers:
    RequestId:
      description: A UUID generated for this one request. Log it; support cannot investigate a failure without one.
      schema: { type: string, format: uuid }
      required: true
    Location:
      description: The URL the browser is sent to. Present on every `303`.
      schema: { type: string, format: uri }
      required: true
    IdempotentReplayed:
      description: "Always present on an answer that went through the Idempotency-Key layer: `false` when this request ran now, `true` when the answer saved under the same key was replayed."
      required: true
      schema: { type: string, enum: ["true", "false"] }
    IdempotencyStatusVersion:
      description: "Always `1` today. Read it before parsing the other key headers, so a future version can add values without breaking you."
      required: true
      schema: { type: string, enum: ["1"] }
    IdempotencyKeyState:
      description: "The key's state after this answer: `completed` — the answer is saved and will be replayed; `pending` — another request with this key is still running; `failed` — the answer was a server error and the key was released, so the same key may be retried."
      required: true
      schema: { type: string, enum: ["pending", "completed", "failed"] }
    IdempotentOriginalAt:
      description: "Present only on a replay: when the saved answer was stored (ISO 8601)."
      schema: { type: string, format: date-time }
    IdempotencyReference:
      description: "Present only on a replay when the saved answer carried a receipt: its `reference`."
      schema: { type: string }
    XRateLimitLimit:
      description: The request ceiling for the current window.
      schema: { type: string }
    XRateLimitRemaining:
      description: Requests remaining in the current window.
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: string }

    CacheControl:
      description: "Always `no-store`: account data, balances and hosted pages must never sit in a shared or browser cache."
      required: true
      schema: { type: string, enum: [no-store] }
  responses:
    BadRequest:
      headers:
        Request-Id: { $ref: "#/components/headers/RequestId" }
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
        X-RateLimit-Limit: { $ref: "#/components/headers/XRateLimitLimit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
      description: The request is invalid (see `code`/`param`). Includes malformed JSON and a missing Idempotency-Key.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            invalid_parameter:
              value: { error: { type: invalid_request_error, code: invalid_parameter, message: currency must be NGN or USD, param: currency } }
            amount_too_small:
              value: { error: { type: invalid_request_error, code: amount_too_small, message: The minimum charge is 5000 NGN, param: amount } }
            idempotency_key_required:
              value: { error: { type: idempotency_error, code: idempotency_key_required, message: "Send a unique Idempotency-Key header (up to 255 characters) with every POST.", param: null } }
            invalid_json:
              value: { error: { type: invalid_request_error, code: invalid_json, message: The request body is not valid JSON., param: null } }
    Unauthorized:
      headers:
        Request-Id: { $ref: "#/components/headers/RequestId" }
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
        X-RateLimit-Limit: { $ref: "#/components/headers/XRateLimitLimit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
      description: The secret key is missing, malformed, revoked, or for the wrong mode.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { type: authentication_error, code: invalid_api_key, message: This API key is invalid or has been revoked., param: null } }
    Forbidden:
      headers:
        Request-Id: { $ref: "#/components/headers/RequestId" }
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
        X-RateLimit-Limit: { $ref: "#/components/headers/XRateLimitLimit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
      description: The key or business is not permitted (IP not allow-listed, business inactive, the key's scopes
        do not cover this endpoint, or live mode is not open).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            insufficient_scope:
              value: { error: { type: authentication_error, code: insufficient_scope, message: "This key (Server ••••4821) does not carry the \"charges:write\" scope. Create a key that does.", param: null } }
            live_mode_unavailable:
              value: { error: { type: invalid_request_error, code: live_mode_unavailable, message: "Live charges are not open yet. Use your ffk_test_ key; your integration will work unchanged when live mode opens.", param: null } }
            live_precondition_unmet:
              value: { error: { type: invalid_request_error, code: live_precondition_unmet, message: "This live card leg waits on FirstFlip's funding rails: a tenant USD balance to move money from. Nothing was changed and no money moved.", param: "funding" } }
            business_inactive:
              value: { error: { type: authentication_error, code: business_inactive, message: The business that owns this key is not active., param: null } }
            ip_not_allowed:
              value: { error: { type: authentication_error, code: ip_not_allowed, message: "Requests from 203.0.113.9 are not on this key's IP allow-list.", param: null } }
    NotFound:
      headers:
        Request-Id: { $ref: "#/components/headers/RequestId" }
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
        X-RateLimit-Limit: { $ref: "#/components/headers/XRateLimitLimit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
      description: No such resource for this key.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { type: invalid_request_error, code: resource_missing, message: "No such charge: ch_test_does_not_exist", param: id } }
    Conflict:
      headers:
        Request-Id: { $ref: "#/components/headers/RequestId" }
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
        X-RateLimit-Limit: { $ref: "#/components/headers/XRateLimitLimit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
        Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
        Idempotency-Status-Version: { $ref: "#/components/headers/IdempotencyStatusVersion" }
        Idempotency-Key-State: { $ref: "#/components/headers/IdempotencyKeyState" }
        Idempotent-Original-At: { $ref: "#/components/headers/IdempotentOriginalAt" }
        Idempotency-Reference: { $ref: "#/components/headers/IdempotencyReference" }
      description: The request conflicts with the resource's state or an in-flight idempotent request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            charge_not_pending:
              value: { error: { type: invalid_request_error, code: charge_not_pending, message: This charge is paid and can no longer be cancelled., param: null } }
            duplicate_reference:
              value: { error: { type: invalid_request_error, code: duplicate_reference, message: "A charge with reference \"order_1048\" already exists", param: reference } }
            idempotency_in_progress:
              value: { error: { type: idempotency_error, code: idempotency_in_progress, message: A request with this Idempotency-Key is still in progress., param: null } }
    PayloadTooLarge:
      headers:
        Request-Id: { $ref: "#/components/headers/RequestId" }
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
        X-RateLimit-Limit: { $ref: "#/components/headers/XRateLimitLimit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
      description: The request body exceeds the size limit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { type: invalid_request_error, code: body_too_large, message: The request body is too large., param: null } }
    Unprocessable:
      headers:
        Request-Id: { $ref: "#/components/headers/RequestId" }
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
        X-RateLimit-Limit: { $ref: "#/components/headers/XRateLimitLimit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
        Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
        Idempotency-Status-Version: { $ref: "#/components/headers/IdempotencyStatusVersion" }
        Idempotency-Key-State: { $ref: "#/components/headers/IdempotencyKeyState" }
        Idempotent-Original-At: { $ref: "#/components/headers/IdempotentOriginalAt" }
        Idempotency-Reference: { $ref: "#/components/headers/IdempotencyReference" }
      description: The Idempotency-Key was already used with a different request body.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { type: idempotency_error, code: idempotency_key_reused, message: This Idempotency-Key was already used with a different request., param: null } }
    RateLimited:
      headers:
        Request-Id: { $ref: "#/components/headers/RequestId" }
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
        X-RateLimit-Limit: { $ref: "#/components/headers/XRateLimitLimit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      description: Too many requests. Honor `Retry-After`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { type: rate_limit_error, code: rate_limited, message: Too many requests. Retry after 30 seconds., param: null } }
    InternalError:
      headers:
        Request-Id: { $ref: "#/components/headers/RequestId" }
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
        X-RateLimit-Limit: { $ref: "#/components/headers/XRateLimitLimit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
      description: An unexpected error on FirstFlip's side.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { type: api_error, code: internal_error, message: Something went wrong on our end., param: null } }
    ServiceUnavailable:
      headers:
        Request-Id: { $ref: "#/components/headers/RequestId" }
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      description: FirstFlip is briefly unavailable (service down or exchange rates unavailable). Retry shortly.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            service_unavailable:
              value: { error: { type: api_error, code: service_unavailable, message: FirstFlip is briefly unavailable. Retry shortly., param: null } }
            rate_unavailable:
              value: { error: { type: api_error, code: rate_unavailable, message: Exchange rates are briefly unavailable. Retry in a few seconds., param: null } }

  schemas:
    Error:
      type: object
      description: The one error shape returned by every /v1 endpoint.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [type, code, message]
          properties:
            type:
              type: string
              description: The family of the error.
              enum:
                - invalid_request_error
                - authentication_error
                - idempotency_error
                - rate_limit_error
                - api_error
            code:
              type: string
              description: Stable, machine-readable reason (see x-error-codes).
            message:
              type: string
              description: Human-readable explanation. Safe to log; not necessarily safe to show verbatim to end-users.
            param:
              type: [string, "null"]
              description: The request field the error refers to, when applicable.
    Account:
      type: object
      description: The business behind the current secret key.
      properties:
        object: { type: string, const: account }
        business_name:
          type: [string, "null"]
          description: The business's display name, or null if unset.
        livemode:
          type: boolean
          description: Whether this key operates on live data. Always false today.
        key:
          type: string
          description: The masked form of the key in use.
          example: ffk_test_…a1b2
      required: [object, livemode, key]
    Metadata:
      type: object
      description: |
        Up to 20 key/value pairs you attach to an object; echoed back on reads and in webhooks.
        Keys match `^[A-Za-z0-9_-]{1,40}$`. Values are stored as strings (numbers and booleans are
        coerced to strings) of at most 500 characters.
      additionalProperties: { type: string }
      maxProperties: 20
      propertyNames:
        pattern: "^[A-Za-z0-9_-]{1,40}$"
      example: { order_id: "1048", channel: web }
    ChargeCustomer:
      type: object
      description: Optional customer details attached to a charge.
      properties:
        name: { type: [string, "null"], maxLength: 120 }
        email: { type: [string, "null"], maxLength: 254, format: email }
    ChargePayment:
      type: object
      description: The crypto payment instructions and quote for a charge.
      properties:
        asset:
          type: string
          enum: [USDT, USDC, BTC]
          description: The asset the customer pays in.
        network:
          type: string
          enum: [trc20, bep20, bitcoin]
          description: The network for the asset.
        address:
          type: string
          description: The pay-to address. In test mode this is a labelled `TEST-…` placeholder that nothing watches.
          example: TEST-TRC20-9f8e7d6c5b4a39281706
        asset_amount:
          type: number
          description: The exact amount of `asset` the customer must send (includes the receive fee).
          example: 15.512345
        fee_asset_amount:
          type: number
          description: The portion of `asset_amount` that is the FirstFlip receive fee.
          example: 1.55
        rate_locked_until:
          type: string
          format: date-time
          description: The quoted rate holds until this time.
    Charge:
      type: object
      description: A one-time request for payment.
      properties:
        id: { type: string, description: "Unique id (`ch_test_…`).", example: ch_test_0a1b2c3d4e5f60718293a4b5 }
        object: { type: string, const: charge }
        livemode: { type: boolean, description: Always false today. }
        status:
          type: string
          enum: [pending, paid, expired, cancelled]
          description: Lifecycle state. Terminal states are paid, expired and cancelled.
        amount:
          type: number
          description: The amount in major units of `currency` (e.g. 25000 means ₦25,000.00).
          example: 25000
        currency: { type: string, enum: [NGN, USD] }
        description: { type: [string, "null"], maxLength: 500 }
        reference: { type: [string, "null"], maxLength: 100, description: Your order id; unique within your business. }
        metadata: { $ref: "#/components/schemas/Metadata" }
        customer: { $ref: "#/components/schemas/ChargeCustomer" }
        payment: { $ref: "#/components/schemas/ChargePayment" }
        hosted_url:
          type: string
          format: uri
          description: The page where the customer completes payment.
          example: https://api.firstflip.ng/v1/sandbox/pay/0123456789abcdef0123456789abcdef
        payment_link:
          type: [string, "null"]
          description: The payment link id (`pl_test_…`) this charge was created from, or null.
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        paid_at: { type: [string, "null"], format: date-time, description: 'When the charge was paid, or null.' }
      required: [id, object, livemode, status, amount, currency, metadata, customer, payment, hosted_url, created_at, expires_at]
    CreateChargeRequest:
      type: object
      description: Body for creating a charge. `amount` is your price; every other number is derived server-side.
      required: [amount, currency]
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
          description: |
            The price in major units of `currency`, at most 2 decimal places. Must be at least the
            minimum charge (default 5 USD / 5000 NGN, configurable) and at most 1,000,000 USD or
            1,000,000,000 NGN.
          example: 25000
        currency: { type: string, enum: [NGN, USD] }
        pay_asset:
          type: string
          enum: [USDT, USDC, BTC]
          default: USDT
          description: The asset the customer pays in.
        pay_network:
          type: string
          enum: [trc20, bep20, bitcoin]
          description: |
            The network. Must be valid for `pay_asset`: USDT → trc20 or bep20 (default trc20);
            USDC → bep20 (default bep20); BTC → bitcoin (default bitcoin). Defaults to the asset's
            default network if omitted.
        description: { type: string, maxLength: 500, description: Shown on the hosted pay page. }
        reference:
          type: string
          maxLength: 100
          description: Your own order id. Must be unique within your business.
        expires_in_minutes:
          type: integer
          minimum: 15
          maximum: 10080
          default: 60
          description: How long the charge stays payable (15 minutes to 7 days).
        metadata: { $ref: "#/components/schemas/Metadata" }
        customer: { $ref: "#/components/schemas/ChargeCustomer" }
    ChargeList:
      type: object
      description: A page of charges, newest first.
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/Charge" }
        has_more:
          type: boolean
          description: Whether more items exist after this page (use `starting_after`).
      required: [object, data, has_more]
    PaymentLink:
      type: object
      description: A reusable link that mints a fresh charge for each visitor.
      properties:
        id: { type: string, description: "Unique id (`pl_test_…`).", example: pl_test_1a2b3c4d5e6f70819a0b1c2d }
        object: { type: string, const: payment_link }
        livemode: { type: boolean, description: Always false today. }
        active: { type: boolean, description: Whether the link still creates new charges. }
        url:
          type: string
          format: uri
          description: The shareable link. Opening it lands on a page that creates a charge on "Continue".
          example: https://api.firstflip.ng/v1/sandbox/l/fedcba9876543210fedcba9876543210
        amount: { type: number, description: "Price per charge, in major units of `currency`." }
        currency: { type: string, enum: [NGN, USD] }
        description: { type: [string, "null"], maxLength: 500 }
        pay_asset: { type: string, enum: [USDT, USDC, BTC] }
        pay_network: { type: string, enum: [trc20, bep20, bitcoin] }
        metadata: { $ref: "#/components/schemas/Metadata" }
        max_uses:
          type: [integer, "null"]
          minimum: 1
          description: Maximum charges the link may create, or null for unlimited.
        uses: { type: integer, description: Charges created from the link so far. }
        created_at: { type: string, format: date-time }
      required: [id, object, livemode, active, url, amount, currency, pay_asset, pay_network, metadata, uses, created_at]
    CreatePaymentLinkRequest:
      type: object
      description: |
        Body for creating a payment link. Shares the amount/currency/asset/network/metadata rules of
        a charge. It has no `reference` or `customer` (those belong on charges) — sending either
        returns 400.
      required: [amount, currency]
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
          description: Price per charge, in major units of `currency` (same bounds as a charge's amount).
          example: 10
        currency: { type: string, enum: [NGN, USD] }
        pay_asset: { type: string, enum: [USDT, USDC, BTC], default: USDT }
        pay_network:
          type: string
          enum: [trc20, bep20, bitcoin]
          description: Must be valid for `pay_asset` (see CreateChargeRequest).
        description: { type: string, maxLength: 500 }
        max_uses:
          type: integer
          minimum: 1
          maximum: 1000000
          description: Cap the number of charges the link may create. Omit for unlimited.
        metadata: { $ref: "#/components/schemas/Metadata" }
    PaymentLinkList:
      type: object
      description: A page of payment links, newest first.
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/PaymentLink" }
        has_more: { type: boolean }
      required: [object, data, has_more]
    SubAccount:
      type: object
      description: |
        One of your end-users, provisioned under your business. A sandbox identity today: no
        wallet, no balance, no real money. `sandbox` states that on every object rather than
        leaving it to the prose.
      properties:
        id: { type: string, description: "Unique id (`sa_test_…`).", example: sa_test_2a3b4c5d6e7f80910a1b2c3d }
        object: { type: string, const: subaccount }
        livemode: { type: boolean, description: Always false today. }
        reference: { type: string, maxLength: 100, description: Your id for this tenant; unique within your business. }
        name: { type: string, maxLength: 100 }
        email: { type: [string, "null"], maxLength: 254 }
        status: { type: string, enum: [active, suspended], description: Your control over the tenant. }
        tier: { type: integer, minimum: 0, maximum: 4, description: Reserved for tiered limits; always 0 today. }
        metadata: { $ref: "#/components/schemas/Metadata" }
        sandbox:
          type: object
          description: What this sub-account can do today.
          properties:
            wallet_provisioned: { type: boolean, const: false, description: No wallet exists for a sub-account yet. }
            accepts_real_money: { type: boolean, const: false, description: 'No, and this flag is the contract.' }
          required: [wallet_provisioned, accepts_real_money]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, object, livemode, reference, name, email, status, tier, metadata, sandbox, created_at, updated_at]
    CreateSubAccountRequest:
      type: object
      description: |
        Body for creating a sub-account. `name` is required; `email` is optional. `reference` is
        yours and must be unique within your business (a repeat returns `409 duplicate_reference`).
        It is used as the id when omitted.
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: The sub-account's display name. }
        email: { type: string, format: email, maxLength: 254, description: Optional contact email. }
        reference: { type: string, minLength: 1, maxLength: 100, description: "Your id for this tenant. Must be unique within your business." }
        metadata: { $ref: "#/components/schemas/Metadata" }
    SubAccountList:
      type: object
      description: A page of sub-accounts, newest first.
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/SubAccount" }
        has_more: { type: boolean }
      required: [object, data, has_more]
    Card:
      type: object
      description: |
        A sandbox USD card issued to one of your customers. Test mode only, and deliberately so: there is no
        issuer behind this object, no PAN exists to leak, and `balance` is a number on this document rather than
        money in a wallet. What is real is the shape and the lifecycle — the same calls, ids and errors your
        integration will make against a live card program.
      properties:
        id: { type: string, description: "Unique id (`card_test_…`); the cursor value for `starting_after`.", example: card_test_3a4b5c6d7e8f90122a3b4c5d }
        object: { type: string, const: card }
        livemode: { type: boolean, description: Always false today — cards are a test-mode surface. }
        reference: { type: string, description: "Your own id for this card. Unique per key and mode; defaults to `id`. Reusing one answers `409 duplicate_reference`.", example: customer_8842_usd }
        status:
          type: string
          enum: [active, frozen, closed]
          description: |
            Lifecycle state. `active` spends and withdraws; `frozen` refuses new authorizations and withdrawals
            but still holds its balance; `closed` is terminal — it cannot be reopened, only replaced.
        currency: { type: string, const: USD, description: The only card currency today. A charge is settled in crypto assets; a card is held in USD. }
        balance:
          type: number
          description: What the card holds, in major units. Money moves only through `/fund`, `/withdraw` and an approved `/simulate_authorization`.
          example: 250
        number_last4:
          type: string
          description: |
            The last four digits of the printed number. Generated when the card was issued and never derived from
            anything: there is no full number anywhere in the platform, so there is nothing to redact and no
            issuer record to look the rest of it up in.
          example: "4921"
        expiry_month: { type: integer, minimum: 1, maximum: 12, description: "Printed expiry month, generated at issue." }
        expiry_year: { type: integer, minimum: 2031, maximum: 2034, description: "Printed expiry year, generated at issue." }
        limits:
          type: object
          description: |
            The spend ceilings a card refuses authorizations against, checked per authorization inside the same
            transaction that moves the balance. `null` means no ceiling on that axis, not zero.
          properties:
            daily: { type: [number, "null"], description: "Rolling 24 hours of approved authorizations, in major units — not a calendar day." }
            per_transaction: { type: [number, "null"], description: "The largest single authorization the card will accept, in major units." }
            monthly: { type: [number, "null"], description: "Rolling 30 days of approved authorizations, in major units." }
        frozen_reason: { type: [string, "null"], description: "The reason you froze the card, or null. Cleared on unfreeze." }
        closed_reason: { type: [string, "null"], description: "The reason you closed the card, or null. Never cleared." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        sandbox:
          type: object
          description: What this card is not. Read it once and stop guessing.
          properties:
            real_card: { type: boolean, const: false, description: "No card network, issuer or PAN stands behind this card." }
            funds_movable: { type: boolean, const: false, description: "A balance here cannot be spent, withdrawn or settled into money." }
      required: [id, object, livemode, reference, status, currency, balance, number_last4, expiry_month, expiry_year, limits, created_at, updated_at, sandbox]
    CardList:
      type: object
      description: A page of cards, newest first.
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/Card" }
        has_more: { type: boolean }
      required: [object, data, has_more]
    CardTransaction:
      type: object
      description: |
        One movement on one card. Every row here is final as it lands: the row and the balance it describes are
        committed in the same MongoDB transaction, so a row can never record a move the card did not take, and a
        balance can never move without the row that says why.
      properties:
        id: { type: string, description: "Unique id (`cardtxn_test_…`).", example: cardtxn_test_5e6f70819a0b1c2d3e4f5061 }
        object: { type: string, const: card_transaction }
        livemode: { type: boolean, description: Always false today. }
        card_id: { type: string, description: The card this moved money on (`card_test_…`). }
        reference: { type: string, description: "Defaults to `id`. Rows are not addressed by reference." }
        type:
          type: string
          enum: [topup, withdrawal, authorization]
          description: "`topup` adds, `withdrawal` takes away, `authorization` is a spend the card's own limits decided."
        status:
          type: string
          enum: [completed, approved, declined]
          description: "`completed` for a funds-in/out row, `approved` or `declined` for an authorization. There is no pending state: a row lands decided."
        currency: { type: string, const: USD }
        amount: { type: number, description: "The amount in major units, always positive. The direction is `type`, never the sign." }
        balance_before: { type: number, description: Card balance in major units before this row applied. }
        balance_after: { type: number, description: "Card balance in major units after it applied — for a decline, the same number as `balance_before`." }
        merchant: { type: [string, "null"], description: "The merchant string you sent with the authorization, or null." }
        decline_code:
          type: [string, "null"]
          description: |
            Why an authorization was refused, or null for anything that landed. This is the field your retry
            logic should branch on: `card_frozen`, `over_per_transaction_limit`, `over_daily_limit`,
            `over_monthly_limit`, `over_tenant_monthly_limit`, `insufficient_funds`. The first four and the
            last are yours to move; `over_tenant_monthly_limit` is a ceiling FirstFlip sets on all of your
            cards together.
        created_at: { type: string, format: date-time }
        sandbox:
          type: object
          properties:
            settled: { type: boolean, const: false, description: "No authorization here clears, so there is no capture, no settlement and no chargeback behind it." }
      required: [id, object, livemode, card_id, type, status, currency, amount, balance_before, balance_after, created_at, sandbox]
    CardTransactionList:
      type: object
      description: A page of one card's transactions, newest first.
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/CardTransaction" }
        has_more: { type: boolean }
      required: [object, data, has_more]
    CreateCardRequest:
      type: object
      description: Issue a card for one of your customers.
      required: [customer]
      additionalProperties: false
      properties:
        currency:
          type: string
          const: USD
          description: Optional, and only ever `USD`. Anything else is `400 invalid_parameter` rather than a fallback.
        reference:
          type: string
          maxLength: 100
          description: "Your id for this card. Unique per key and mode; defaults to the generated `id`. A second attempt with the same reference and a different Idempotency-Key answers `409 duplicate_reference`."
          example: customer_8842_usd
        customer:
          type: object
          description: |
            Who the card is for. Only these three fields are accepted, and nothing about the customer is stored —
            the same rule virtual accounts hold. Names and emails live in your database; the card carries your
            `reference` so you can join them back.
          required: [email, first_name, last_name]
          additionalProperties: false
          properties:
            email: { type: string, format: email, maxLength: 254, description: "Must be a valid address: `someone@app` is rejected, `someone@app.co` is not." }
            first_name: { type: string, minLength: 1, maxLength: 100 }
            last_name: { type: string, minLength: 1, maxLength: 100 }
        daily_limit: { type: [number, "null"], minimum: 0.01, description: "Rolling-24h authorization ceiling in major units. Omit or null for no ceiling." }
        per_transaction_limit: { type: [number, "null"], minimum: 0.01, description: "Largest single authorization in major units. Omit or null for no ceiling." }
        monthly_limit: { type: [number, "null"], minimum: 0.01, description: "Rolling-30-day authorization ceiling in major units. Omit or null for no ceiling." }
    CardAmountRequest:
      type: object
      required: [amount]
      additionalProperties: false
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
          maximum: 100000000000
          description: |
            Major units with at most two decimals (so `10.005` is a `400`, and so are `true`, `[]` and `"10"` —
            no coercion, because a silently converted amount is a reconciliation break you find later).
          example: 100
    CardReasonRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: Stored on the card and echoed on every read, so your support desk can see why a card stopped.
          example: Customer reported a lost device
    CardLimitsRequest:
      type: object
      description: |
        Change the spend ceilings. Only the axes you name are written: an omitted field means "leave it alone",
        an explicit `null` means "remove that ceiling". That distinction is the whole point — a partial update
        cannot silently unlimit an axis you forgot to send.
      minProperties: 1
      additionalProperties: false
      properties:
        daily_limit: { type: [number, "null"], minimum: 0.01, description: "Rolling 24 hours, major units." }
        per_transaction_limit: { type: [number, "null"], minimum: 0.01, description: "Largest single authorization, major units." }
        monthly_limit: { type: [number, "null"], minimum: 0.01, description: "Rolling 30 days, major units." }
    CardAuthorizationRequest:
      type: object
      required: [amount]
      additionalProperties: false
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
          maximum: 100000000000
          description: The swipe, in major units with at most two decimals.
          example: 42.5
        merchant:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            Free text, stored on the row. It does not change the verdict: no merchant category, country or channel
            is evaluated, because nothing here settles. Send it anyway — it is the field your reconciliation will
            want when this lane goes live.
          example: BLUE ORIGIN TRAVEL
    AssistantAnswer:
      type: object
      description: An answer from the developer documentation assistant.
      properties:
        object: { type: string, const: assistant_answer }
        answer: { type: string, description: 'The answer, drawn only from published FirstFlip docs.' }
        removed_claims:
          type: integer
          minimum: 0
          description: How many unsupported claims the safety scrub removed from the answer.
      required: [object, answer, removed_claims]
    Event:
      type: object
      description: |
        A webhook event FirstFlip POSTs to your registered endpoint. The body is signed; verify
        `FirstFlip-Signature` over the raw bytes before parsing.
      properties:
        id: { type: string, description: "Unique event id (`evt_…`).", example: evt_0a1b2c3d4e5f60718293a4b5 }
        object: { type: string, const: event }
        type:
          type: string
          description: The event type.
          enum: [charge.paid, charge.expired, charge.cancelled, fx.quote.processing, fx.quote.ready, fx.quote.expired, fx.quote.failed, fx.trade.pending, fx.trade.settled, fx.trade.failed, virtual_account.payment.successful, virtual_account.payment.failed, virtual_account.payment.reversed, bvn.verified, bvn.declined, bvn.failed, transfer.pending, transfer.successful, transfer.failed, card.created, card.funded, card.withdrawn, card.frozen, card.unfrozen, card.closed, card.limits.updated, card.authorization.approved, card.authorization.declined]
        livemode: { type: boolean, description: Always false today. }
        created_at: { type: string, format: date-time }
        data:
          type: object
          description: The event payload.
          properties:
            object:
              oneOf:
                - $ref: "#/components/schemas/Charge"
                - $ref: "./api/services.openapi.json#/components/schemas/FxQuote"
                - $ref: "./api/services.openapi.json#/components/schemas/FxTrade"
                - $ref: "./api/services.openapi.json#/components/schemas/VirtualAccountPayment"
                - $ref: "./api/services.openapi.json#/components/schemas/BvnVerification"
                - $ref: "./api/services.openapi.json#/components/schemas/Transfer"
                - $ref: "#/components/schemas/Card"
                - $ref: "#/components/schemas/CardTransaction"
          required: [object]
      required: [id, object, type, livemode, created_at, data]
    WebhookEndpoint:
      type: object
      description: |
        A destination FirstFlip POSTs events to. Managed by the business owner over
        `POST /api/business/developer/webhooks` (not via /v1). The signing secret (`whsec_…`) is shown once at creation
        and stored encrypted so deliveries can be signed. The URL must be public HTTPS on port 443
        (an SSRF guard rejects private, loopback, and FirstFlip-owned hosts). Shown here as the
        reusable object SDKs model.
      properties:
        id: { type: string, description: "Unique id (`we_…`).", example: we_7f8e9d0c1b2a30415263748a }
        mode: { type: string, enum: [test, live] }
        url: { type: string, format: uri, maxLength: 2048 }
        disabled_at: { type: [string, "null"], format: date-time, description: 'When the endpoint was disabled, or null.' }
        created_at: { type: string, format: date-time }
      required: [id, mode, url, created_at]

