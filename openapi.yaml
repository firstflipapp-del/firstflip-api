        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /cards/{id}/unfreeze:
    post:
      operationId: unfreezeCard
      x-display-name: "Unfreeze a virtual card"
      x-required-scope: cards:write
      tags: [Cards]
      summary: Unfreeze a virtual card
      description: |
        Returns a frozen card to `active` and clears `frozen_reason`. A frozen card keeps its balance,
        so unfreezing restores spending without funding it again.

        A closed card cannot be reopened — `409 card_closed` says to issue a new one. Unfreezing a card
        that is already active answers `200` with its current state. Requires an `Idempotency-Key`
        header. No request body is read.

        Live mode: this leg runs live with the same ordering as freeze — the issuer releases the card first,
        and our record follows only if it agrees. A refusing issuer answers `503 service_unavailable` and the
        card stays `frozen`.
      parameters:
        - $ref: "#/components/parameters/CardId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          headers:
            Request-Id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            X-RateLimit-Limit: { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
            Idempotency-Status-Version: { $ref: "#/components/headers/IdempotencyStatusVersion" }
            Idempotency-Key-State: { $ref: "#/components/headers/IdempotencyKeyState" }
            Idempotent-Original-At: { $ref: "#/components/headers/IdempotentOriginalAt" }
            Idempotency-Reference: { $ref: "#/components/headers/IdempotencyReference" }
          description: The card is active again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
              examples:
                active:
                  $ref: "#/components/examples/cardIssued"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /cards/{id}/close:
    post:
      operationId: closeCard
      x-display-name: "Close a virtual card"
      x-required-scope: cards:write
      tags: [Cards]
      summary: Close a virtual card
      description: |
        Ends the card for good, from either `active` or `frozen`. `reason` (max 200 chars) is stored
        and returned as `closed_reason`.

        Close is terminal: every later write against the card answers `409 card_closed`, and the card
        cannot be reopened — issue a new one. Closing an already-closed card answers `200`. Any
        balance still on the card is left as recorded against it and is not paid out by this call;
        withdraw it first if the money must come back. Requires an `Idempotency-Key` header.

        Live mode: refused — closing a real card has to settle whatever is outstanding against it, and the
        settlement rail is not built. This answers `403 live_precondition_unmet` with `param: settlement`
        and changes nothing, on either side.
      parameters:
        - $ref: "#/components/parameters/CardId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardReasonRequest" }
            example: { reason: Customer left the platform }
      responses:
        "200":
          headers:
            Request-Id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            X-RateLimit-Limit: { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
            Idempotency-Status-Version: { $ref: "#/components/headers/IdempotencyStatusVersion" }
            Idempotency-Key-State: { $ref: "#/components/headers/IdempotencyKeyState" }
            Idempotent-Original-At: { $ref: "#/components/headers/IdempotentOriginalAt" }
            Idempotency-Reference: { $ref: "#/components/headers/IdempotencyReference" }
          description: The card is closed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
              examples:
                closed:
                  $ref: "#/components/examples/cardClosed"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /cards/{id}/spend_limits:
    post:
      operationId: updateCardSpendLimits
      x-display-name: "Update a card's spend limits"
      x-required-scope: cards:write
      tags: [Cards]
      summary: Update a card's spend limits
      description: |
        Sets the merchant-side ceilings an authorization is judged against. Send at least one of
        `daily_limit`, `per_transaction_limit` or `monthly_limit`; the axes you leave out are left
        alone, and an explicit `null` clears that axis (no ceiling).

        `daily_limit` and `monthly_limit` are rolling windows — 24 hours and 30 days from now, not a
        calendar day or month — and they are summed from the **committed** approvals at the moment the
        spend lands, not from a read taken earlier. That is what makes the ceiling hold when thirty
        authorizations arrive at once. `per_transaction_limit` is a single-authorization maximum and is
        checked before either window. Requires an `Idempotency-Key` header.

        Live mode: refused — the issuer has rejected every amount format this platform has tried on that
        call, and a ceiling sent in the wrong unit is worse than none. Writing it only on our side would be
        a limit a live card does not actually obey, so this answers `403 live_precondition_unmet` with
        `param: limit_format`.
      parameters:
        - $ref: "#/components/parameters/CardId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardLimitsRequest" }
            example: { daily_limit: 100, monthly_limit: null }
      responses:
        "200":
          headers:
            Request-Id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            X-RateLimit-Limit: { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
            Idempotency-Status-Version: { $ref: "#/components/headers/IdempotencyStatusVersion" }
            Idempotency-Key-State: { $ref: "#/components/headers/IdempotencyKeyState" }
            Idempotent-Original-At: { $ref: "#/components/headers/IdempotentOriginalAt" }
            Idempotency-Reference: { $ref: "#/components/headers/IdempotencyReference" }
          description: The card with its new `limits`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
              examples:
                limited:
                  $ref: "#/components/examples/cardLimited"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /cards/{id}/simulate_authorization:
    post:
      operationId: simulateCardAuthorization
      x-display-name: "Simulate a card authorization"
      x-required-scope: cards:write
      tags: [Cards]
      summary: Simulate a card authorization
      description: |
        The stand-in for a live purchase, and the only way to see an approval or a decline on this
        surface. An **approved** authorization is the debit: the ledger row (`type: authorization`,
        `status: approved`) and the balance drop commit together. A **declined** one writes the row
        with `status: declined` and a `decline_code`, and moves no money.

        The decline reason is decided in this order: `card_frozen`, `over_per_transaction_limit`,
        `over_daily_limit`, `over_monthly_limit`, `over_tenant_monthly_limit`, `insufficient_funds`.
        Code your retry logic against those six — a frozen card and an over-limit card are different
        customer conversations, and `insufficient_funds` is the one a top-up fixes.
        `over_tenant_monthly_limit` is the only one of the six that is not yours to set: it is a
        ceiling FirstFlip places on what all of your cards may spend in a rolling 30 days
        (**$1,000,000** of approved authorization spend per business).

        Every answer is `201`: a decline is a recorded outcome of a real request, not a failed one.
        A closed card is the exception and answers `409 card_closed`. Requires an `Idempotency-Key`
        header — the same key cannot approve and decline two different attempts.

        Live mode: refused with `403 live_mode_unavailable`, and this is the one leg that will stay that way.
      parameters:
        - $ref: "#/components/parameters/CardId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardAuthorizationRequest" }
            example: { amount: 25, merchant: Netflix }
      responses:
        "201":
          headers:
            Request-Id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            X-RateLimit-Limit: { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
            Idempotency-Status-Version: { $ref: "#/components/headers/IdempotencyStatusVersion" }
            Idempotency-Key-State: { $ref: "#/components/headers/IdempotencyKeyState" }
            Idempotent-Original-At: { $ref: "#/components/headers/IdempotentOriginalAt" }
            Idempotency-Reference: { $ref: "#/components/headers/IdempotencyReference" }
          description: The authorization, approved or declined, with the balance either side of it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardTransaction" }
              examples:
                approved:
                  $ref: "#/components/examples/cardAuthorizationApproved"
                declined:
                  $ref: "#/components/examples/cardAuthorizationDeclined"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /cards/{id}/transactions:
    get:
      operationId: listCardTransactions
      x-display-name: "List a card's transactions"
      x-required-scope: cards:read
      tags: [Cards]
      summary: List a card's transactions
      description: |
        The card's own ledger, newest first: every credit, withdrawal and authorization attempt,
        approved or declined. This is the reconciliation source — the rows sum to the card's
        `balance`, and a declined row carries the `decline_code` that explains it.

        Filter by `type` (`topup`, `withdrawal`, `authorization`) and/or `status` (`completed`,
        `approved`, `declined`), by a `created_from`/`created_before` window, and page with `limit`
        plus `starting_after`.

        Live mode: refused — the rows behind a live card are the issuer's, and they are not synced into this
        platform yet. An empty list would read as "this card has spent nothing", which is a guess, so this
        answers `403 live_precondition_unmet` with `param: transaction_sync`.
      parameters:
        - $ref: "#/components/parameters/CardId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/CreatedFrom"
        - $ref: "#/components/parameters/CreatedBefore"
        - name: type
          in: query
          required: false
          description: Only rows of this kind.
          schema: { type: string, enum: [topup, withdrawal, authorization], example: authorization }
        - name: status
          in: query
          required: false
          description: Only rows in this final state.
          schema: { type: string, enum: [completed, approved, declined], example: declined }
      responses:
        "200":
          headers:
            Request-Id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            X-RateLimit-Limit: { $ref: "#/components/headers/XRateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
          description: A page of the card's transactions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardTransactionList" }
              examples:
                page:
                  $ref: "#/components/examples/cardTransactionList"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

