name: docs
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Lints openapi.yaml and fails if postman/ or reference/ is stale.
      - run: npm run check
      - run: npm test
        working-directory: sdks/node
